version: "3.9" # optional, can remove if using Docker Compose v2

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-build
    working_dir: /app/frontend
    ports:
      - "5173:5173" # Vite dev server
    volumes:
      - ./frontend:/app/frontend # mount local code for hot reload
      - /app/frontend/node_modules
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true # for file watching inside Docker

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    ports:
      - "8000:8000" # backend API
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      - frontend
